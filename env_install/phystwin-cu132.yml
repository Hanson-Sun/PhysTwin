# Single environment for RGB-D processing, warp training and Gaussian inference.
# The build script compiles GroundingDINO, SAM 2 and PyTorch3D against it.
name: phystwin-cu132
channels:
  - nvidia
  - defaults
dependencies:
  - python=3.10.20
  - pip=26.1.2
  - cuda-toolkit=13.2.0
  - cuda-compiler=13.2.0
  - gcc_linux-64=14.3.0
  - gxx_linux-64=14.3.0
  - libgl-devel=1.7.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu132
      - torch==2.12.1+cu132
      - torchvision==0.27.1+cu132
      - numpy==1.26.4
      - scipy==1.15.3
      - cma==4.4.0
      - supervision>=0.25,<1
      - PyYAML==6.0.3
      - pillow==12.2.0
      - matplotlib==3.10.8
      # GUI-enabled build required by tools/view_depth_video.py; do not install
      # opencv-python-headless alongside it.
      - opencv-python==4.11.0.86
      - termcolor==3.3.0
      - imageio==2.37.3
      - imageio-ffmpeg==0.6.0
      - moviepy
      - tqdm
      - scikit-learn
      # Used by qqtt/engine/trainer_warp_upstream.py.
      - wandb==0.30.0
      - scikit-image==0.25.2
      - fvcore
      - einops
      - diffusers==0.30.3
      - accelerate
      # pynput's evdev dependency does not build against conda's sysroot; its
      # X11 backend (installed --no-deps) only needs python-xlib.
      - python-xlib
      - six
      - usd-core
      - pyglet<2
      - rtree
      - warp-lang==1.12.1
      - open3d==0.19.0
      - glfw==2.10.0
      - PyOpenGL==3.1.0
      # Bundles MuJoCo's optional elasticity plugin libraries (including cable).
      - mujoco>=3.3.0
      # Required to tetrahedralize soft-object meshes for MuJoCo.
      - gmsh==4.15.2
      - ninja==1.13.0
      - kornia==0.8.2
      - plyfile==1.1.3
      - pyrender==0.1.45
      - trimesh==4.11.5
      - jaxtyping==0.3.7
      - rich==15.0.0
      # --- RGB-D segmentation / shape prior ---
      # transformers 4.46 requires tokenizers 0.20 and huggingface-hub < 1.
      - transformers==4.46.3
      - tokenizers==0.20.3
      - huggingface-hub==0.26.2
      # SAM 2: hydra-core, omegaconf, iopath. GroundingDINO: timm, addict, yapf.
      - hydra-core>=1.3.2
      - omegaconf
      - iopath>=0.1.10
      - timm
      - addict
      - yapf
      - pycocotools
variables:
  PYTHONNOUSERSITE: "1"

# Prefix-dependent paths are derived from CONDA_PREFIX by the extension build.
# After creating and activating this environment, run:
#   ./env_install/build_cuda13_extensions.sh
