# Data-processing environment for PhysTwin segmentation and tracking.
# Keep this separate from phystwin-cu132: the legacy GroundingDINO extension
# is not compatible with Boba's PyTorch 2.12/CUDA 13.2 stack.
name: phystwin-data
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - pip
  - cuda-toolkit=12.1
  - cuda-compiler=12.1
  - pytorch=2.4.0
  - torchvision=0.19.0
  - pytorch-cuda=12.1
  - pip:
      - numpy==1.26.4
      - scipy==1.15.3
      - PyYAML==6.0.3
      - pillow
      - opencv-python
      - open3d
      - trimesh
      - imageio
      - imageio-ffmpeg
      - supervision>=0.25,<1
      - tqdm
      - scikit-learn
      - scikit-image
      - fvcore
      - einops
      - diffusers==0.30.3
      - accelerate
      - transformers==4.46.3
      - tokenizers==0.20.3
      - huggingface-hub==0.26.2
      - addict
      - pycocotools
      - timm
      - yapf
      - rtree
      # Prebuilt pytorch3d wheel matching python 3.10 / torch 2.4 / cu121;
      # building from source would require the full CUDA toolchain.
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - --find-links https://dl.fbaipublicfiles.com/pytorch3d/packaging/wheels/py310_cu121_pyt240/
      - pytorch3d==0.7.8
variables:
  PYTHONNOUSERSITE: "1"
  CUDA_HOME: "/usr/local/cuda-12.1"