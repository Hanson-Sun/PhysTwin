data_type: "real"
FPS: 30
dt: 5e-5
num_substeps: 667
dashpot_damping: 100
drag_damping: 3
learn_damping: false
base_lr: 1e-3
iterations: 200
vis_interval: 20
init_spring_Y: 3e4
collide_elas: 0.5
collide_fric: 0.5
collide_object_elas: 0.7
collide_object_fric: 0.3
object_radius: 0.02
object_max_neighbours: 30
controller_radius: 0.04
controller_max_neighbours: 50
controller_contact_radius: 0.018
controller_contact_activation_radius: 0.018
controller_contact_release_radius: 0.0225
spring_Y_min: 0
spring_Y_max: 1e5
reverse_z: true
vp_front: [1, 0, -2]
vp_up: [0, 0, -1]
vp_zoom: 1
collision_dist: 0.02
collision_learn: true
chamfer_weight: 1.0
track_weight: 1.0
# Anchored mass field enabled for rigid bodies (required for heavy-end/arbitrary
# CoM). K=128 FPS, kNN4, mass-normalized contact keeps penetration m-independent.
# learn_damping stays false (rigid doesn't need damping fine-tune; rope does).
learn_mass: true
init_mass: 1.0
mass_min: 0.1
mass_max: 10.0
mass_reg_weight: 1.0e-4
mass_smooth_weight: 0.0
mass_num_anchors: 128
mass_anchor_knn: 4
mass_anchor_seed: 42
mass_anchor_method: fps
